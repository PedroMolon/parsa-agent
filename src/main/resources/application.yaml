spring:
  application:
    name: parsa-agent
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show_sql: true
  flyway:
    enabled: true

server:
  port: 8080

obsidian:
  vault-path: ${OBSIDIAN_PATH}